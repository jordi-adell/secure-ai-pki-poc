name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  demo:
    name: PKI Demo (Layers 1–3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - uses: helm/kind-action@v1
        with:
          cluster_name: pki-poc

      - name: Run PKI demo (CI mode — no rotation wait)
        run: make demo-ci

  dashboard:
    name: Dashboard Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build dashboard
        run: go build -o /tmp/pki-dashboard ./cmd/dashboard

      - name: Start dashboard and smoke test
        run: |
          /tmp/pki-dashboard &
          DASH_PID=$!

          # wait up to 10s for the server to bind
          for i in $(seq 1 10); do
            curl -sf http://localhost:8080/api/status >/dev/null 2>&1 && break
            sleep 1
          done

          curl -sf http://localhost:8080/api/status \
            | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert 'certs' in d, 'missing certs key'
          assert 'deployments' in d, 'missing deployments key'
          assert 'rotations' in d, 'missing rotations key'
          print('✔ /api/status OK')
          "

          curl -sf http://localhost:8080/report \
            | grep -q 'Certificate Report' && echo "✔ /report OK"

          kill "$DASH_PID"
