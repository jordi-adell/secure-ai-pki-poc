apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: client-tls
  namespace: pki-layer2
spec:
  secretName: client-tls
  issuerRef:
    name: workload-issuer
    kind: ClusterIssuer
    group: cert-manager.io
  commonName: client.pki-layer2.svc.cluster.local
  dnsNames:
    - client.pki-layer2.svc.cluster.local
    - client.pki-layer2
    - client
  subject:
    organizations:
      - pki-poc
  duration: 24h
  renewBefore: 1h
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
    - digital signature
    - key encipherment
    - client auth
